<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141419"/>
      <stop offset="1" stop-color="#0e0e11"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="70%">
      <stop offset="0" stop-color="#5e6ad2" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#5e6ad2" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- logo -->
  <g transform="translate(90,90)">
    <rect width="64" height="64" rx="15" fill="#5e6ad2"/>
    <rect x="14" y="12" width="15" height="40" rx="3" fill="#fff"/>
    <rect x="35" y="12" width="15" height="24" rx="3" fill="#fff" opacity=".7"/>
    <text x="86" y="42" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="30" font-weight="600" fill="#e6e6ea">Linear MultiBoard</text>
  </g>

  <text x="90" y="290" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="72" font-weight="700" fill="#e6e6ea">All your Linear</text>
  <text x="90" y="372" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="72" font-weight="700" fill="#8f9bff">workspaces, one screen.</text>

  <text x="90" y="452" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="30" fill="#9a9aa6">Read-only Kanban boards across every workspace.</text>
  <text x="90" y="494" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="30" fill="#9a9aa6">Open source · No backend · Keys stay on your machine.</text>

  <!-- mini columns -->
  <g transform="translate(90,540)">
    <rect width="150" height="52" rx="9" fill="#1b1b20" stroke="#2a2a31"/>
    <circle cx="20" cy="26" r="5" fill="#9a9aa6"/><text x="34" y="31" font-family="sans-serif" font-size="16" fill="#9a9aa6">Triage</text>
    <rect x="166" width="150" height="52" rx="9" fill="#1b1b20" stroke="#2a2a31"/>
    <circle cx="186" cy="26" r="5" fill="#e2c541"/><text x="200" y="31" font-family="sans-serif" font-size="16" fill="#9a9aa6">Todo</text>
    <rect x="332" width="190" height="52" rx="9" fill="#1b1b20" stroke="#2a2a31"/>
    <circle cx="352" cy="26" r="5" fill="#5e6ad2"/><text x="366" y="31" font-family="sans-serif" font-size="16" fill="#9a9aa6">In Progress</text>
    <rect x="538" width="150" height="52" rx="9" fill="#1b1b20" stroke="#2a2a31"/>
    <circle cx="558" cy="26" r="5" fill="#3fb950"/><text x="572" y="31" font-family="sans-serif" font-size="16" fill="#9a9aa6">Done</text>
  </g>
</svg>
