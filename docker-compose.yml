# Self-host: `cp .env.example .env`, fill in the values, then `docker compose up -d`.
# For local development, `docker compose up -d db` gives you just the database.
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://multiboard:${POSTGRES_PASSWORD:-multiboard}@db:5432/multiboard
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: multiboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-multiboard}
      POSTGRES_DB: multiboard
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U multiboard"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
